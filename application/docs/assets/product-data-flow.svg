<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">LinkOps product data flow</title>
  <desc id="desc">Client requests flow through FastAPI to DynamoDB and SQS; an analytics worker writes hourly aggregates while structured telemetry is emitted.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#46607a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#15324b" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1280" height="680" rx="28" fill="#f5f8fb"/>
  <text x="64" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#16324f">LinkOps product plane</text>
  <text x="64" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#526b82">Synchronous redirect path with privacy-safe asynchronous analytics</text>

  <g filter="url(#shadow)">
    <rect x="64" y="190" width="210" height="116" rx="18" fill="#e8f1fb" stroke="#5b9be6" stroke-width="2"/>
    <text x="169" y="238" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#174d7d">Client</text>
    <text x="169" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#365a76">create / resolve</text>

    <rect x="360" y="190" width="250" height="116" rx="18" fill="#e8faf2" stroke="#45bf8a" stroke-width="2"/>
    <text x="485" y="238" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#176746">FastAPI</text>
    <text x="485" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#356c56">LinkService + validation</text>

    <rect x="704" y="142" width="240" height="110" rx="18" fill="#fff4dc" stroke="#e6a83d" stroke-width="2"/>
    <text x="824" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#83540d">DynamoDB</text>
    <text x="824" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#795f31">links + aliases</text>

    <rect x="704" y="318" width="240" height="110" rx="18" fill="#f0eafd" stroke="#9676df" stroke-width="2"/>
    <text x="824" y="364" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#50368f">SQS</text>
    <text x="824" y="396" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#62518b">sanitized click events</text>

    <rect x="1010" y="318" width="206" height="110" rx="18" fill="#e8f1fb" stroke="#5b9be6" stroke-width="2"/>
    <text x="1113" y="364" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#174d7d">Worker</text>
    <text x="1113" y="396" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#365a76">Lambda consumer</text>

    <rect x="1010" y="142" width="206" height="110" rx="18" fill="#fff4dc" stroke="#e6a83d" stroke-width="2"/>
    <text x="1113" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#83540d">DynamoDB</text>
    <text x="1113" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#795f31">hourly analytics</text>

    <rect x="360" y="470" width="250" height="110" rx="18" fill="#edf0f4" stroke="#8798aa" stroke-width="2"/>
    <text x="485" y="516" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#3d5368">Observability</text>
    <text x="485" y="548" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5f7183">logs, metrics, audit</text>
  </g>

  <g fill="none" stroke="#46607a" stroke-width="3" marker-end="url(#arrow)">
    <path d="M274 248 H360"/>
    <path d="M610 224 H704"/>
    <path d="M610 270 C660 300 675 350 704 370"/>
    <path d="M944 373 H1010"/>
    <path d="M1010 198 H944"/>
    <path d="M485 306 V470" stroke-dasharray="8 8"/>
  </g>
  <text x="650" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#46607a">link state</text>
  <text x="635" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#46607a">async event</text>
  <text x="982" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#46607a">consume</text>
</svg>
