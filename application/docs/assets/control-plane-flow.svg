<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">LinkOps governed engineering control plane</title>
  <desc id="desc">A LangGraph workflow moves from intake through planning, design approval, parallel development QA and security, validation, release approval, and completion with repair and safe-stop paths.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#536779"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#15324b" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1440" height="760" rx="28" fill="#f6f8fb"/>
  <text x="64" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#16324f">Governed engineering control plane</text>
  <text x="64" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#526b82">Typed LangGraph state, explicit approvals, parallel quality branches, and recoverable failure paths</text>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="64" y="180" width="180" height="82" rx="16" fill="#e8f1fb" stroke="#5b9be6" stroke-width="2"/>
    <text x="154" y="230" text-anchor="middle" font-size="22" font-weight="700" fill="#174d7d">Intake</text>
    <rect x="300" y="180" width="180" height="82" rx="16" fill="#e8f1fb" stroke="#5b9be6" stroke-width="2"/>
    <text x="390" y="230" text-anchor="middle" font-size="22" font-weight="700" fill="#174d7d">Plan</text>
    <rect x="536" y="180" width="180" height="82" rx="16" fill="#e8faf2" stroke="#45bf8a" stroke-width="2"/>
    <text x="626" y="230" text-anchor="middle" font-size="22" font-weight="700" fill="#176746">Design</text>
    <rect x="772" y="180" width="210" height="82" rx="16" fill="#fff4dc" stroke="#e6a83d" stroke-width="2"/>
    <text x="877" y="230" text-anchor="middle" font-size="22" font-weight="700" fill="#83540d">Approval gate</text>

    <rect x="536" y="350" width="180" height="82" rx="16" fill="#edf0f4" stroke="#8798aa" stroke-width="2"/>
    <text x="626" y="400" text-anchor="middle" font-size="21" font-weight="700" fill="#3d5368">Development</text>
    <rect x="772" y="350" width="180" height="82" rx="16" fill="#edf0f4" stroke="#8798aa" stroke-width="2"/>
    <text x="862" y="400" text-anchor="middle" font-size="21" font-weight="700" fill="#3d5368">QA / tests</text>
    <rect x="1008" y="350" width="180" height="82" rx="16" fill="#edf0f4" stroke="#8798aa" stroke-width="2"/>
    <text x="1098" y="400" text-anchor="middle" font-size="21" font-weight="700" fill="#3d5368">Security</text>

    <rect x="772" y="520" width="180" height="82" rx="16" fill="#e8faf2" stroke="#45bf8a" stroke-width="2"/>
    <text x="862" y="570" text-anchor="middle" font-size="22" font-weight="700" fill="#176746">Validate</text>
    <rect x="1008" y="520" width="180" height="82" rx="16" fill="#fff4dc" stroke="#e6a83d" stroke-width="2"/>
    <text x="1098" y="570" text-anchor="middle" font-size="21" font-weight="700" fill="#83540d">Release gate</text>
    <rect x="1244" y="520" width="132" height="82" rx="16" fill="#e8faf2" stroke="#45bf8a" stroke-width="2"/>
    <text x="1310" y="570" text-anchor="middle" font-size="22" font-weight="700" fill="#176746">Done</text>

    <rect x="300" y="520" width="180" height="82" rx="16" fill="#fdebea" stroke="#dd6b66" stroke-width="2"/>
    <text x="390" y="570" text-anchor="middle" font-size="21" font-weight="700" fill="#8e302b">Repair / stop</text>
  </g>

  <g fill="none" stroke="#536779" stroke-width="3" marker-end="url(#arrow)">
    <path d="M244 221 H300"/>
    <path d="M480 221 H536"/>
    <path d="M716 221 H772"/>
    <path d="M877 262 V312 H626 V350"/>
    <path d="M877 262 V312 H862 V350"/>
    <path d="M877 262 V312 H1098 V350"/>
    <path d="M626 432 V480 H862 V520"/>
    <path d="M862 432 V520"/>
    <path d="M1098 432 V480 H862 V520"/>
    <path d="M952 561 H1008"/>
    <path d="M1188 561 H1244"/>
    <path d="M772 561 H480"/>
    <path d="M390 520 V300 H390 V262" stroke-dasharray="8 8"/>
  </g>
  <text x="748" y="305" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#536779">parallel fan-out / fan-in</text>
  <text x="570" y="496" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#8e302b">recoverable failure</text>
  <text x="296" y="642" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#526b82">Artifacts, audit events, hashes, checkpoints, and metrics are emitted throughout the graph.</text>
</svg>
