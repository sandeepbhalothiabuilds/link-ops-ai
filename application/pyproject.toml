[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "linkops-ai"
version = "0.1.0"
description = "Governed agentic SDLC orchestration for a production-style URL shortener."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "LinkOps AI" }]
dependencies = [
  "boto3>=1.35.0",
  "fastapi>=0.115.0",
  "langchain-aws>=0.2.0",
  "langgraph>=0.2.0",
  "mangum>=0.17.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7.9",
  "httpx>=0.27.0",
  "moto[dynamodb,sqs]>=5.0.0",
  "mypy>=1.13.0",
  "pip-audit>=2.7.3",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
]
aws = [
  "langgraph-checkpoint-aws>=1.2.2",
]

[project.scripts]
linkops = "linkops_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/linkops_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = [
  "functional: end-to-end API behavior",
  "orchestration: LangGraph workflow behavior",
  "security: security and policy checks",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = []

[tool.coverage.run]
branch = true
source = ["linkops_ai"]
omit = [
  "src/linkops_ai/adapters/aws_product.py",
  "src/linkops_ai/adapters/bedrock.py",
  "src/linkops_ai/adapters/checkpoints.py",
  "src/linkops_ai/adapters/agentcore_memory.py",
  "src/linkops_ai/product/lambda_handler.py",
  "src/linkops_ai/product/worker.py",
  "src/linkops_ai/cli.py",
]

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
