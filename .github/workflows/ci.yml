name: monorepo-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  application-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=linkops_ai --cov-report=term-missing --cov-report=xml
      - run: bandit -r src -ll

  infrastructure-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check app.py infrastructure scripts tests lambda_code
      - run: mypy app.py infrastructure scripts
      - run: pytest -q
